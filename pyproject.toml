[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlwm-data-factory"
version = "0.1.0"
description = "Restartable, provenance-first dataset factory for HLWM training episodes"
requires-python = ">=3.9"
dependencies = [
  "azure-identity>=1.17.0",
  "beautifulsoup4>=4.12.0",
  "jsonschema>=4.20.0",
  "langid>=1.1.6",
  "openai>=1.40.0",
  "pypdf>=4.0.0",
  "pyarrow>=15.0.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hlwm-data = "hlwm_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
