conversion_contract:
  universal_required_fields:
    - source identifier, exact revision and licence evidence
    - original split and immutable record identifier
    - English-language result
    - task, constraints, available evidence and expected artifacts
    - final answer or artifact plus machine-verifiable evidence where possible
    - provenance chain for every derived record
  coding:
    - Reproduce the issue in a pinned container
    - Retain minimal patch, tests, commands, exit codes and rollback
    - Reject patches that do not apply or whose claimed tests were not executed
  data_analysis:
    - Freeze a source table and generate business questions from its real columns
    - Compute answers independently with SQL or formulas
    - Include assumptions, denominator, units, uncertainty and reconciliation
    - Generate counterfactual variants by changing data, not by rewriting the answer
  business_analysis:
    - Require stakeholder, objective, constraints, process, requirements, alternatives, risks and acceptance criteria
    - Ground conclusions in supplied evidence and mark unresolved questions
    - Use one teacher for subjective synthesis and human-audit a stratified sample
  tools_agents:
    - Validate JSON Schema and argument types
    - Replay every tool observation in a deterministic sandbox
    - Include timeout, malformed result, permission failure and recovery cases
    - Reject fabricated browsing or repository inspection claims
  ui_ux:
    - Generate original layouts rather than copied branded pages or assets
    - Render fixed desktop and mobile viewports
    - Test keyboard navigation, empty/loading/error states and accessibility
  finance_marketing:
    - Preserve an evidence ledger and recompute every number
    - Separate facts, assumptions, recommendations and uncertainty
    - Reject unsupported investment, revenue or campaign-performance claims

quality_gates:
  exact_and_near_duplicate_free: true
  semantic_task_family_isolation: true
  protected_split_hash_and_embedding_index: true
  executable_records_must_pass: true
  subjective_records_human_audit_fraction: 0.10
  maximum_unverified_claim_rate: 0.0
  maximum_visible_private_reasoning_rate: 0.0
  one_teacher_calls_per_subjective_record: 1

