benchmark_training_policy:
  allowed:
    - Official upstream training splits with permissive rights and preserved split lineage
    - New problems generated from the underlying skill with different entities, numbers, structure and solution path
    - Training records whose answers are recomputed by tests, SQL, formulas, simulators or source-grounded rubrics
  forbidden:
    - Validation, test, hidden, challenge, leaderboard or post-cutoff evaluation questions
    - Test-answer repositories, benchmark result dumps and contaminated mirrors
    - Paraphrases, translations or cosmetic mutations of protected evaluation questions
    - Selecting checkpoints on the protected test set
  reporting:
    - Scores from a family whose training split was used are labelled trained-on-family diagnostics
    - Primary claims use untouched task families, post-cutoff releases and ExpertBench-1500
    - Base-model pretraining contamination is reported as unknown

official_training_split_candidates:
  mathematics_reasoning:
    - GSM8K train; test protected
    - MATH train; test and MATH-500 protected
    - ARC train; challenge evaluation protected
    - BBH skill analogues only; canonical BBH tasks protected
  coding:
