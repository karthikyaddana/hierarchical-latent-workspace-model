policy:
  # Blanket rule the fail-closed tests assert on: benchmark items never train.
  allowed_for_training: false
  finance_domain_benchmarks: intentionally_excluded
  lm_eval_harness_registry: reports/data-research-2026-08-19/benchmark-registry-163.csv
  # We may learn from an upstream benchmark's official training split when its
  # licence permits it.  We never train on the questions used to report scores.
  official_training_splits_allowed_after_audit: true
  evaluation_items_allowed_for_training: false
  reserve_all_validation_test_hidden_and_challenge_splits: true
  reserve_future_or_temporally_newer_releases: true
  transformed_evaluation_questions_allowed: false
  generated_skill_analogues_allowed: true
  requirements_for_training_split_use:
    - exact upstream source and revision
    - permissive training rights
    - English content verification
    - split lineage preserved before conversion
    - exact near-duplicate and semantic-family contamination checks
    - executable or deterministic answer verification where possible
    - no reference answer copied into an evaluation prompt family
  contamination_hash_check_required: true
  semantic_contamination_check_required: true
  evaluate_base_model_before_fine_tuning: true
collection_references:
  - url: https://huggingface.co/collections/sugatoray/rlms-reasoning-language-models
    role: Research and model reference only; models are not training data and are not assumed to exist in Azure.
  - url: https://huggingface.co/collections/sugatoray/papers-benchmarks
    role: Evaluation discovery only; all dataset items remain excluded from training exports.
